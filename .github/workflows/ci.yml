name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Windows is needed: the plug-in targets .NET Framework 4.6.2 and the tests run on .NET Framework 4.8.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore AmlGuard.sln

      - name: Build (Release)
        run: dotnet build AmlGuard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AmlGuard.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
