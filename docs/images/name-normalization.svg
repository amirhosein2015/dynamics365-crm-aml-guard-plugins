<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-labelledby="t d">
<title id="t">Name normalization and exact matching</title>
<desc id="d">Two examples. 'JOSÉ martinez' with an accent and extra spaces normalizes to 'jose martinez' and exactly matches the list entry. 'Jose Martines', one letter different, does not match.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0e1526"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
<style>
  .headline{font:700 25px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f1f5f9}
  .subhead{font:400 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .tag{font:700 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.9px}
  .t{font:700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f1f5f9}
  .p{font:400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9aa6c2}
  .small{font:400 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .axis{font:400 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .bar{font:700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#0b1020}
  .big{font:700 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#ffffff}
  .mono{font:400 12px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#d7deee}
  .monob{font:400 15px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#f1f5f9}
  .pill{font:700 11.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.6px}
</style>
<rect width="1200" height="508" rx="16" fill="url(#bg)"/>
<text x="60" y="52" class="headline">Same name in another spelling is caught. A different name is not guessed.</text>
<text x="60" y="78" class="subhead">The same normalization runs on the typed name and on every sanctions-list entry, so both sides always agree.</text>
<rect x="40" y="108" width="214" height="160" rx="12" fill="#111827" stroke="#2b3550" stroke-width="1.2"/>
<rect x="40" y="122" width="4" height="132" rx="2" fill="#f5c451"/>
<text x="60" y="134" class="tag" fill="#f5c451" style="fill:#f5c451">TYPED IN THE CRM</text>
<text x="60" y="190" class="monob">"  JOSÉ   martinez "</text>
<text x="60" y="216" class="p">contact created</text>
<line x1="254" y1="188" x2="284" y2="188" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="288" y="108" width="552" height="160" rx="12" fill="#0c1b1f" stroke="#2dd4bf" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="308" y="134" class="tag" fill="#5eead4" style="fill:#5eead4">NORMALIZATION, STEP BY STEP</text>
<rect x="304" y="150" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="365" y="174" text-anchor="middle" class="t" style="font-size:13.5px">trim</text>
<text x="365" y="216" text-anchor="middle" class="mono">JOSÉ   martinez</text>
<path d="M429 164 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="438" y="150" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="499" y="174" text-anchor="middle" class="t" style="font-size:13.5px">one space</text>
<text x="499" y="216" text-anchor="middle" class="mono">JOSÉ martinez</text>
<path d="M563 164 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="572" y="150" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="633" y="174" text-anchor="middle" class="t" style="font-size:13.5px">lower case</text>
<text x="633" y="216" text-anchor="middle" class="mono">josé martinez</text>
<path d="M697 164 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="706" y="150" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="767" y="174" text-anchor="middle" class="t" style="font-size:13.5px">no accents</text>
<text x="767" y="216" text-anchor="middle" class="mono">jose martinez</text>
<text x="308" y="250" class="small">the text after each step</text>
<line x1="840" y1="188" x2="870" y2="188" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="874" y="108" width="286" height="160" rx="12" fill="#2a1519" stroke="#fca5a5" stroke-width="1.4"/>
<text x="894" y="134" class="tag" style="fill:#fca5a5">COMPARED WITH THE LIST</text>
<text x="894" y="164" class="monob">jose martinez</text>
<text x="894" y="188" class="p">equals the list entry "Jose Martinez"</text>
<rect x="894" y="202" width="142" height="28" rx="14" fill="none" stroke="#fca5a5" stroke-width="1.4"/>
<text x="965" y="220" text-anchor="middle" class="pill" style="fill:#fca5a5">EXACT MATCH</text>
<text x="894" y="252" class="small">contact set to Under Review, Critical alert</text>
<rect x="40" y="292" width="214" height="160" rx="12" fill="#111827" stroke="#2b3550" stroke-width="1.2"/>
<rect x="40" y="306" width="4" height="132" rx="2" fill="#f5c451"/>
<text x="60" y="318" class="tag" fill="#f5c451" style="fill:#f5c451">TYPED IN THE CRM</text>
<text x="60" y="374" class="monob">"Jose Martines"</text>
<text x="60" y="400" class="p">one letter different</text>
<line x1="254" y1="372" x2="284" y2="372" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="288" y="292" width="552" height="160" rx="12" fill="#0c1b1f" stroke="#2dd4bf" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="308" y="318" class="tag" fill="#5eead4" style="fill:#5eead4">NORMALIZATION, STEP BY STEP</text>
<rect x="304" y="334" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="365" y="358" text-anchor="middle" class="t" style="font-size:13.5px">trim</text>
<text x="365" y="400" text-anchor="middle" class="mono">Jose Martines</text>
<path d="M429 348 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="438" y="334" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="499" y="358" text-anchor="middle" class="t" style="font-size:13.5px">one space</text>
<text x="499" y="400" text-anchor="middle" class="mono">Jose Martines</text>
<path d="M563 348 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="572" y="334" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="633" y="358" text-anchor="middle" class="t" style="font-size:13.5px">lower case</text>
<text x="633" y="400" text-anchor="middle" class="mono">jose martines</text>
<path d="M697 348 l6 5 l-6 5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
<rect x="706" y="334" width="122" height="38" rx="9" fill="#0a1417" stroke="#14b8a6" stroke-width="1.2"/>
<text x="767" y="358" text-anchor="middle" class="t" style="font-size:13.5px">no accents</text>
<text x="767" y="400" text-anchor="middle" class="mono">jose martines</text>
<text x="308" y="434" class="small">the text after each step</text>
<line x1="840" y1="372" x2="870" y2="372" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="874" y="292" width="286" height="160" rx="12" fill="#0f2420" stroke="#5eead4" stroke-width="1.4"/>
<text x="894" y="318" class="tag" style="fill:#5eead4">COMPARED WITH THE LIST</text>
<text x="894" y="348" class="monob">jose martines</text>
<text x="894" y="372" class="p">differs from the list entry "Jose Martinez"</text>
<rect x="894" y="386" width="118" height="28" rx="14" fill="none" stroke="#5eead4" stroke-width="1.4"/>
<text x="953" y="404" text-anchor="middle" class="pill" style="fill:#5eead4">NO MATCH</text>
<text x="894" y="436" class="small">no alert: exact matching, by design</text>
</svg>
