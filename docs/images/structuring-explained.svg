<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-labelledby="t d">
<title id="t">Split deposits add up to a flagged pattern</title>
<desc id="d">Bar chart: three deposits of 4,000, 3,500 and 3,200 are each below the 10,000 reporting threshold, but their total of 10,700 within 24 hours crosses it and raises a High alert.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0e1526"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
<style>
  .headline{font:700 25px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f1f5f9}
  .subhead{font:400 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .tag{font:700 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.9px}
  .t{font:700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f1f5f9}
  .p{font:400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9aa6c2}
  .small{font:400 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .axis{font:400 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .bar{font:700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#0b1020}
  .big{font:700 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#ffffff}
  .mono{font:400 12px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#d7deee}
  .monob{font:400 15px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#f1f5f9}
  .pill{font:700 11.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.6px}
</style>
<rect width="1200" height="548" rx="16" fill="url(#bg)"/>
<text x="60" y="52" class="headline">Each deposit stays under the line. Together they do not.</text>
<text x="60" y="78" class="subhead">Fictional customer, three deposits inside 24 hours, reporting threshold 10,000.</text>
<line x1="100" y1="470.0" x2="800" y2="470.0" stroke="#243049" stroke-width="1"/>
<text x="90" y="474.0" text-anchor="end" class="axis">0</text>
<line x1="100" y1="340.0" x2="800" y2="340.0" stroke="#243049" stroke-width="1"/>
<text x="90" y="344.0" text-anchor="end" class="axis">5,000</text>
<line x1="100" y1="470.0" x2="100" y2="158.0" stroke="#243049" stroke-width="1"/>
<line x1="100" y1="210.0" x2="800" y2="210.0" stroke="#fdba74" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="90" y="214.0" text-anchor="end" class="axis" fill="#fdba74" style="fill:#fdba74">10,000</text>
<text x="108" y="202.0" class="small" style="fill:#fdba74">reporting threshold</text>
<rect x="130" y="366.0" width="110" height="104.0" rx="6" fill="#7dd3fc"/>
<text x="185" y="423.0" text-anchor="middle" class="bar">4,000</text>
<text x="185" y="494" text-anchor="middle" class="axis">3 h ago</text>
<text x="185" y="512" text-anchor="middle" class="small" style="fill:#5eead4">no flag alone</text>
<rect x="280" y="379.0" width="110" height="91.0" rx="6" fill="#c4b5fd"/>
<text x="335" y="429.5" text-anchor="middle" class="bar">3,500</text>
<text x="335" y="494" text-anchor="middle" class="axis">2 h ago</text>
<text x="335" y="512" text-anchor="middle" class="small" style="fill:#5eead4">no flag alone</text>
<rect x="430" y="386.8" width="110" height="83.2" rx="6" fill="#5eead4"/>
<text x="485" y="433.4" text-anchor="middle" class="bar">3,200</text>
<text x="485" y="494" text-anchor="middle" class="axis">now</text>
<text x="485" y="512" text-anchor="middle" class="small" style="fill:#5eead4">no flag alone</text>
<text x="260" y="429.2" text-anchor="middle" class="big">+</text>
<text x="410" y="429.2" text-anchor="middle" class="big">+</text>
<text x="595" y="429.2" text-anchor="middle" class="big">=</text>
<rect x="650" y="366.0" width="130" height="104.0" fill="#7dd3fc" stroke="#0b1020" stroke-width="1.5"/>
<text x="715" y="423.0" text-anchor="middle" class="bar">4,000</text>
<rect x="650" y="275.0" width="130" height="91.0" fill="#c4b5fd" stroke="#0b1020" stroke-width="1.5"/>
<text x="715" y="325.5" text-anchor="middle" class="bar">3,500</text>
<rect x="650" y="191.8" width="130" height="83.2" fill="#5eead4" stroke="#0b1020" stroke-width="1.5"/>
<text x="715" y="238.4" text-anchor="middle" class="bar">3,200</text>
<rect x="650" y="191.8" width="130" height="278.2" fill="none" stroke="#fca5a5" stroke-width="2.2" rx="4"/>
<text x="715" y="181.8" text-anchor="middle" class="big">10,700</text>
<rect x="650" y="112" width="130" height="28" rx="14" fill="#2a1519" stroke="#fca5a5" stroke-width="1.3"/>
<text x="715" y="130.5" text-anchor="middle" class="pill" style="fill:#fca5a5">ALERT · HIGH</text>
<text x="715" y="494" text-anchor="middle" class="axis">total in the 24 h window</text>
<text x="715" y="512" text-anchor="middle" class="small" style="fill:#fca5a5">10,700 reaches 10,000</text>
<rect x="840" y="104" width="320" height="400" rx="14" fill="#111827" stroke="#2b3550" stroke-width="1.2"/>
<text x="862" y="134" class="tag" fill="#f5c451" style="fill:#f5c451">WHAT THE PLUG-IN DECIDES</text>
<circle cx="878" cy="176" r="13" fill="#2a2212" stroke="#f5c451" stroke-width="1.3"/>
<text x="878" y="180" text-anchor="middle" class="pill" style="fill:#f5c451">1</text>
<text x="904" y="174" class="t">Looks back 24 hours</text>
<text x="904" y="193" class="p">from the new deposit, for this</text>
<text x="904" y="209" class="p">customer only</text>
<circle cx="878" cy="256" r="13" fill="#2a2212" stroke="#f5c451" stroke-width="1.3"/>
<text x="878" y="260" text-anchor="middle" class="pill" style="fill:#f5c451">2</text>
<text x="904" y="254" class="t">Counts deposits below 10,000</text>
<text x="904" y="273" class="p">at least 3 of them are needed</text>
<circle cx="878" cy="336" r="13" fill="#2a2212" stroke="#f5c451" stroke-width="1.3"/>
<text x="878" y="340" text-anchor="middle" class="pill" style="fill:#f5c451">3</text>
<text x="904" y="334" class="t">Adds them up</text>
<text x="904" y="353" class="p">10,700 reaches the threshold</text>
<circle cx="878" cy="416" r="13" fill="#2a2212" stroke="#f5c451" stroke-width="1.3"/>
<text x="878" y="420" text-anchor="middle" class="pill" style="fill:#f5c451">4</text>
<text x="904" y="414" class="t">Raises one High alert</text>
<text x="904" y="433" class="p">the explanation names count, total and</text>
<text x="904" y="449" class="p">window; a 4th deposit adds no</text>
<text x="904" y="465" class="p">duplicate</text>
</svg>
